<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-label="A retro desktop window showing a website being built">
  <defs>
    <linearGradient id="hDesk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b3b"/>
      <stop offset="1" stop-color="#008080"/>
    </linearGradient>
    <linearGradient id="hBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000080"/>
      <stop offset="1" stop-color="#008080"/>
    </linearGradient>
    <linearGradient id="hSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
  </defs>

  <rect width="760" height="560" fill="url(#hDesk)"/>

  <!-- retro sun -->
  <circle cx="600" cy="120" r="72" fill="url(#hSun)" opacity="0.85"/>
  <g fill="#0b0b3b" opacity="0.55">
    <rect x="520" y="96" width="160" height="7"/>
    <rect x="520" y="112" width="160" height="9"/>
    <rect x="520" y="130" width="160" height="11"/>
    <rect x="520" y="150" width="160" height="13"/>
  </g>

  <!-- perspective grid -->
  <g stroke="#00ffff" stroke-width="2" opacity="0.45" fill="none">
    <path d="M0 400 H760"/>
    <path d="M0 440 H760"/>
    <path d="M0 490 H760"/>
    <path d="M0 550 H760"/>
    <path d="M380 400 L120 560 M380 400 L260 560 M380 400 L380 560 M380 400 L500 560 M380 400 L640 560"/>
  </g>

  <!-- window -->
  <g>
    <rect x="60" y="70" width="470" height="330" fill="#ffffff" stroke="#000" stroke-width="4"/>
    <rect x="60" y="70" width="470" height="34" fill="url(#hBar)" stroke="#000" stroke-width="4"/>
    <text x="76" y="93" font-family="Verdana,Geneva,sans-serif" font-size="14" font-weight="bold" fill="#ffffff">index.html — Retro Fusion</text>
    <g>
      <rect x="470" y="79" width="16" height="15" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
      <rect x="490" y="79" width="16" height="15" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
      <rect x="510" y="79" width="16" height="15" fill="#ff8c8c" stroke="#000" stroke-width="2"/>
    </g>

    <!-- fake page content -->
    <rect x="80" y="120" width="180" height="22" fill="#000080"/>
    <rect x="80" y="154" width="430" height="9" fill="#c9c9c9"/>
    <rect x="80" y="170" width="400" height="9" fill="#c9c9c9"/>
    <rect x="80" y="186" width="340" height="9" fill="#c9c9c9"/>

    <rect x="80" y="212" width="130" height="86" fill="#ffcc00" stroke="#000" stroke-width="3"/>
    <rect x="220" y="212" width="130" height="86" fill="#ff2d95" stroke="#000" stroke-width="3"/>
    <rect x="360" y="212" width="130" height="86" fill="#00c0c0" stroke="#000" stroke-width="3"/>

    <rect x="80" y="316" width="120" height="30" fill="#c0c0c0" stroke="#000" stroke-width="3"/>
    <rect x="212" y="316" width="120" height="30" fill="#000080" stroke="#000" stroke-width="3"/>

    <!-- blinking caret -->
    <rect x="96" y="326" width="10" height="10" fill="#000" opacity="0.75"/>
  </g>

  <!-- floating badges -->
  <g>
    <rect x="500" y="420" width="88" height="31" fill="#000"/>
    <rect x="501" y="421" width="86" height="29" fill="#000080"/>
    <text x="544" y="441" font-family="Verdana,Geneva,sans-serif" font-size="8" font-weight="bold" fill="#00ff00" text-anchor="middle">EST. 1996</text>

    <rect x="598" y="420" width="88" height="31" fill="#000"/>
    <rect x="599" y="421" width="86" height="29" fill="#8b0000"/>
    <text x="642" y="441" font-family="Verdana,Geneva,sans-serif" font-size="8" font-weight="bold" fill="#ffe600" text-anchor="middle">NO COOKIES</text>
  </g>

  <!-- cursor -->
  <g transform="translate(430,340)">
    <path d="M0 0 L0 26 L7 19 L12 30 L18 27 L13 16 L22 15 Z" fill="#fff" stroke="#000" stroke-width="2"/>
  </g>
</svg>
