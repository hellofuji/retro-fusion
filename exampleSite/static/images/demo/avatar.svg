<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Pixel art portrait">
  <rect width="240" height="240" fill="#008080"/>
  <g fill="#ffffff" opacity="0.14">
    <rect x="0" y="0" width="240" height="8"/><rect x="0" y="24" width="240" height="8"/>
    <rect x="0" y="48" width="240" height="8"/><rect x="0" y="72" width="240" height="8"/>
    <rect x="0" y="96" width="240" height="8"/><rect x="0" y="120" width="240" height="8"/>
    <rect x="0" y="144" width="240" height="8"/><rect x="0" y="168" width="240" height="8"/>
    <rect x="0" y="192" width="240" height="8"/><rect x="0" y="216" width="240" height="8"/>
  </g>

  <g transform="translate(40,28) scale(10)" shape-rendering="crispEdges">
    <!-- hair -->
    <rect x="4" y="1" width="8" height="2" fill="#3b2314"/>
    <rect x="3" y="3" width="10" height="3" fill="#3b2314"/>
    <rect x="2" y="6" width="2" height="6" fill="#3b2314"/>
    <rect x="12" y="6" width="2" height="6" fill="#3b2314"/>
    <!-- face -->
    <rect x="4" y="5" width="8" height="8" fill="#f2c9a0"/>
    <rect x="5" y="13" width="6" height="2" fill="#f2c9a0"/>
    <!-- eyes -->
    <rect x="5" y="8" width="2" height="2" fill="#101010"/>
    <rect x="9" y="8" width="2" height="2" fill="#101010"/>
    <rect x="5" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="8" width="1" height="1" fill="#ffffff"/>
    <!-- glasses -->
    <rect x="4" y="7" width="4" height="1" fill="#101010"/>
    <rect x="8" y="7" width="4" height="1" fill="#101010"/>
    <rect x="4" y="7" width="1" height="4" fill="#101010"/>
    <rect x="11" y="7" width="1" height="4" fill="#101010"/>
    <rect x="8" y="11" width="4" height="1" fill="#101010"/>
    <!-- nose + mouth -->
    <rect x="8" y="11" width="1" height="1" fill="#d4a373"/>
    <rect x="6" y="13" width="4" height="1" fill="#c1440e"/>
    <!-- neck + shoulders -->
    <rect x="7" y="15" width="2" height="1" fill="#e0b58c"/>
    <rect x="3" y="16" width="10" height="4" fill="#ff2d95"/>
    <rect x="7" y="16" width="2" height="1" fill="#e0b58c"/>
    <rect x="6" y="17" width="4" height="1" fill="#ffe600"/>
  </g>

  <rect x="0" y="0" width="240" height="240" fill="none" stroke="#000" stroke-width="6"/>
</svg>
