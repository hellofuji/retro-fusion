<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="A grid of beveled retro UI buttons">
  <rect width="800" height="600" fill="#c0c0c0"/>
  <g fill="#b0b0b0">
    <rect x="0" y="0" width="800" height="4"/><rect x="0" y="60" width="800" height="4"/>
    <rect x="0" y="120" width="800" height="4"/><rect x="0" y="180" width="800" height="4"/>
    <rect x="0" y="240" width="800" height="4"/><rect x="0" y="300" width="800" height="4"/>
    <rect x="0" y="360" width="800" height="4"/><rect x="0" y="420" width="800" height="4"/>
    <rect x="0" y="480" width="800" height="4"/><rect x="0" y="540" width="800" height="4"/>
  </g>

  <text x="400" y="90" font-family="'Courier New',monospace" font-size="30" font-weight="bold" fill="#000080" text-anchor="middle">&lt;button&gt;</text>

  <g stroke-width="5">
    <!-- row 1: classic bevel -->
    <rect x="70" y="140" width="190" height="60" fill="#d4d0c8" stroke="#ffffff"/>
    <rect x="75" y="145" width="180" height="50" fill="none" stroke="#6e6e6e" stroke-width="4"/>
    <text x="165" y="178" font-family="Verdana,sans-serif" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">outset</text>

    <rect x="305" y="140" width="190" height="60" fill="#d4d0c8" stroke="#6e6e6e"/>
    <rect x="310" y="145" width="180" height="50" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="400" y="178" font-family="Verdana,sans-serif" font-size="16" font-weight="bold" fill="#7a7a7a" text-anchor="middle">inset</text>

    <rect x="540" y="140" width="190" height="60" fill="#000080" stroke="#000"/>
    <text x="635" y="178" font-family="Verdana,sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">primary</text>
  </g>

  <!-- window mock -->
  <rect x="130" y="250" width="540" height="260" fill="#ffffff" stroke="#000" stroke-width="5"/>
  <rect x="130" y="250" width="540" height="40" fill="#008080" stroke="#000" stroke-width="5"/>
  <text x="150" y="278" font-family="Verdana,sans-serif" font-size="16" font-weight="bold" fill="#fff">dialog.gif</text>
  <rect x="600" y="260" width="16" height="16" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
  <rect x="622" y="260" width="16" height="16" fill="#c0c0c0" stroke="#000" stroke-width="2"/>
  <rect x="644" y="260" width="16" height="16" fill="#ff8c8c" stroke="#000" stroke-width="2"/>

  <g fill="#c9c9c9">
    <rect x="156" y="312" width="470" height="12"/><rect x="156" y="336" width="420" height="12"/>
    <rect x="156" y="360" width="450" height="12"/>
  </g>

  <rect x="380" y="410" width="130" height="46" fill="#d4d0c8" stroke="#fff" stroke-width="5"/>
  <rect x="385" y="415" width="120" height="36" fill="none" stroke="#6e6e6e" stroke-width="4"/>
  <text x="445" y="440" font-family="Verdana,sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">OK</text>

  <rect x="524" y="410" width="130" height="46" fill="#d4d0c8" stroke="#fff" stroke-width="5"/>
  <rect x="529" y="415" width="120" height="36" fill="none" stroke="#6e6e6e" stroke-width="4"/>
  <text x="589" y="440" font-family="Verdana,sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">Cancel</text>
</svg>
