<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-label="A ring of retro website badges connected by arrows">
  <defs>
    <linearGradient id="s3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b3d"/>
      <stop offset="1" stop-color="#0b0b3b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="525" fill="url(#s3bg)"/>

  <!-- ring path -->
  <circle cx="600" cy="262" r="180" fill="none" stroke="#00c0c0" stroke-width="6" stroke-dasharray="18 12" opacity="0.8"/>
  <circle cx="600" cy="262" r="120" fill="none" stroke="#ff2d95" stroke-width="3" opacity="0.5"/>

  <!-- arrowheads on the ring -->
  <g fill="#00ffff">
    <polygon points="780,262 762,252 762,272"/>
    <polygon points="600,442 590,424 610,424"/>
  </g>

  <!-- member badges around the ring -->
  <g font-family="Verdana,sans-serif" font-size="8" font-weight="bold" text-anchor="middle">
    <g transform="translate(556,62)">
      <rect width="88" height="31" fill="#000"/><rect x="1" y="1" width="86" height="29" fill="#000080"/>
      <text x="44" y="20" fill="#00ff00">MY HOMEPAGE</text>
    </g>
    <g transform="translate(756,150)">
      <rect width="88" height="31" fill="#000"/><rect x="1" y="1" width="86" height="29" fill="#8b0000"/>
      <text x="44" y="20" fill="#ffe600">PIXEL ART</text>
    </g>
    <g transform="translate(796,330)">
      <rect width="88" height="31" fill="#000"/><rect x="1" y="1" width="86" height="29" fill="#006400"/>
      <text x="44" y="20" fill="#ffffff">GUESTBOOK</text>
    </g>
    <g transform="translate(556,432)">
      <rect width="88" height="31" fill="#000"/><rect x="1" y="1" width="86" height="29" fill="#4b0082"/>
      <text x="44" y="20" fill="#00ffff">WEBRING</text>
    </g>
    <g transform="translate(316,330)">
      <rect width="88" height="31" fill="#000"/><rect x="1" y="1" width="86" height="29" fill="#000080"/>
      <text x="44" y="20" fill="#ff2d95">LINKS PAGE</text>
    </g>
    <g transform="translate(316,150)">
      <rect width="88" height="31" fill="#000"/><rect x="1" y="1" width="86" height="29" fill="#b8860b"/>
      <text x="44" y="20" fill="#000">UNDER CONSTR</text>
    </g>
  </g>

  <!-- centre label -->
  <g text-anchor="middle" font-family="'Trebuchet MS',Verdana,sans-serif">
    <text x="600" y="252" font-size="30" font-weight="bold" fill="#ffffff">THE RETRO RING</text>
    <text x="600" y="284" font-size="16" fill="#00ffff">20 sites · hand-curated · no algorithm</text>
    <text x="600" y="312" font-size="14" fill="#ff2d95">« Prev · Random · Next »</text>
  </g>
</svg>
