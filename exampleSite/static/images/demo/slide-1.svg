<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-label="A beige retro computer on a teal background">
  <defs>
    <linearGradient id="s1bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b3b"/>
      <stop offset="0.6" stop-color="#008080"/>
      <stop offset="1" stop-color="#00c0c0"/>
    </linearGradient>
    <linearGradient id="s1screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001a1a"/>
      <stop offset="1" stop-color="#004d4d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="525" fill="url(#s1bg)"/>

  <!-- dotted halftone -->
  <g fill="#ffffff" opacity="0.18">
    <circle cx="80" cy="60" r="3"/><circle cx="130" cy="60" r="3"/><circle cx="180" cy="60" r="3"/>
    <circle cx="80" cy="110" r="3"/><circle cx="130" cy="110" r="3"/><circle cx="180" cy="110" r="3"/>
    <circle cx="1020" cy="430" r="3"/><circle cx="1070" cy="430" r="3"/><circle cx="1120" cy="430" r="3"/>
    <circle cx="1020" cy="480" r="3"/><circle cx="1070" cy="480" r="3"/><circle cx="1120" cy="480" r="3"/>
  </g>

  <!-- monitor -->
  <g>
    <rect x="380" y="70" width="440" height="330" rx="10" fill="#d4d0c8" stroke="#000" stroke-width="5"/>
    <rect x="410" y="100" width="380" height="250" fill="url(#s1screen)" stroke="#000" stroke-width="5"/>
    <g font-family="'Courier New',monospace" font-size="20" fill="#39ff14">
      <text x="432" y="140">C:\&gt; hugo server</text>
      <text x="432" y="172">Building sites …</text>
      <text x="432" y="204" fill="#ffe600">✓ 142 pages in 380ms</text>
      <text x="432" y="236">Web Server is available at</text>
      <text x="432" y="268" fill="#00ffff">http://localhost:1313/</text>
      <text x="432" y="316" fill="#39ff14">_</text>
    </g>
    <rect x="560" y="400" width="80" height="30" fill="#b0aca4" stroke="#000" stroke-width="4"/>
    <rect x="460" y="430" width="280" height="22" fill="#c0bcb4" stroke="#000" stroke-width="4"/>
  </g>

  <!-- badges -->
  <g>
    <rect x="60" y="250" width="88" height="31" fill="#000"/>
    <rect x="61" y="251" width="86" height="29" fill="#000080"/>
    <text x="104" y="271" font-family="Verdana,sans-serif" font-size="8" font-weight="bold" fill="#00ff00" text-anchor="middle">380ms BUILD</text>

    <rect x="60" y="300" width="88" height="31" fill="#000"/>
    <rect x="61" y="301" width="86" height="29" fill="#8b0000"/>
    <text x="104" y="321" font-family="Verdana,sans-serif" font-size="8" font-weight="bold" fill="#ffe600" text-anchor="middle">0 KB JS BLOCK</text>
  </g>

  <!-- floppy -->
  <g transform="translate(920,220)">
    <rect x="0" y="0" width="150" height="150" fill="#1a1a2e" stroke="#000" stroke-width="4"/>
    <rect x="30" y="8" width="90" height="58" fill="#c0c0c0" stroke="#000" stroke-width="3"/>
    <rect x="52" y="18" width="46" height="38" fill="#3a3a5a" stroke="#000" stroke-width="2"/>
    <rect x="30" y="96" width="90" height="46" fill="#e8e8e8" stroke="#000" stroke-width="3"/>
    <rect x="42" y="108" width="66" height="6" fill="#8c8c8c"/>
    <rect x="42" y="122" width="66" height="6" fill="#8c8c8c"/>
  </g>
</svg>
