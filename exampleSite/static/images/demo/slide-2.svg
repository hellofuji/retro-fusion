<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="525" viewBox="0 0 1200 525" role="img" aria-label="Pixel art rocket launching over a starfield">
  <defs>
    <linearGradient id="s2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12002e"/>
      <stop offset="1" stop-color="#3b0a52"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="525" fill="url(#s2bg)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="90" cy="70" r="2.5"/><circle cx="240" cy="40" r="1.8"/><circle cx="420" cy="110" r="2.2"/>
    <circle cx="600" cy="55" r="1.6"/><circle cx="760" cy="130" r="2.6"/><circle cx="940" cy="60" r="2"/>
    <circle cx="1100" cy="120" r="1.9"/><circle cx="170" cy="260" r="2.4"/><circle cx="1050" cy="300" r="2.7"/>
    <circle cx="60" cy="420" r="2"/><circle cx="330" cy="480" r="2.3"/><circle cx="880" cy="470" r="1.7"/>
    <circle cx="1160" cy="470" r="2.5"/><circle cx="520" cy="440" r="1.8"/><circle cx="700" cy="500" r="2.2"/>
  </g>

  <!-- pixel rocket -->
  <g transform="translate(470,90) scale(7.6)" shape-rendering="crispEdges">
    <rect x="8" y="0" width="4" height="3" fill="#ff2d95"/>
    <rect x="6" y="3" width="8" height="3" fill="#e8e8f0"/>
    <rect x="4" y="6" width="12" height="6" fill="#ffffff"/>
    <rect x="6" y="8" width="3" height="3" fill="#00c2ff"/>
    <rect x="11" y="8" width="3" height="3" fill="#00c2ff"/>
    <rect x="4" y="12" width="12" height="3" fill="#e8e8f0"/>
    <rect x="2" y="15" width="4" height="3" fill="#c0c0cc"/>
    <rect x="14" y="15" width="4" height="3" fill="#c0c0cc"/>
    <rect x="4" y="15" width="12" height="4" fill="#ffffff"/>
    <rect x="6" y="19" width="3" height="3" fill="#ffcc00"/>
    <rect x="11" y="19" width="3" height="3" fill="#ffcc00"/>
    <rect x="9" y="19" width="2" height="2" fill="#ff6600"/>
  </g>

  <!-- exhaust -->
  <g shape-rendering="crispEdges">
    <rect x="548" y="248" width="46" height="20" fill="#ff6600"/>
    <rect x="556" y="268" width="30" height="18" fill="#ffcc00"/>
    <rect x="564" y="286" width="16" height="16" fill="#ffe600"/>
    <rect x="556" y="302" width="30" height="12" fill="#ff6600" opacity="0.7"/>
    <rect x="548" y="314" width="46" height="10" fill="#ff2d95" opacity="0.5"/>
  </g>

  <!-- launch pad / wireframe ground -->
  <g stroke="#00ffff" stroke-width="2" opacity="0.4" fill="none">
    <path d="M0 470 H1200"/>
    <path d="M0 505 H1200"/>
    <path d="M200 470 L120 525 M400 470 L360 525 M600 470 L600 525 M800 470 L840 525 M1000 470 L1080 525"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="60" y="420" width="88" height="31" fill="#000"/>
    <rect x="61" y="421" width="86" height="29" fill="#000080"/>
    <text x="104" y="441" font-family="Verdana,sans-serif" font-size="8" font-weight="bold" fill="#00ff00" text-anchor="middle">SHIP IT 🚀</text>
  </g>
</svg>
