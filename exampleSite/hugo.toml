# ============================================================================
# Retro Fusion - example site configuration
# ----------------------------------------------------------------------------
# Copy this file to your site root as `hugo.toml` (or `config.toml`) and edit.
# Every key below is optional; delete what you don't need and the theme falls
# back to its built-in retro defaults.
#
# ============================================================================

# Your real domain, with the trailing slash. It feeds canonical URLs, the
# sitemap, the Open Graph tags and the RSS feed, so leaving a placeholder here
# points all of them at a domain you don't own.
baseURL = "https://retro-fusion.abhishkkumar.com/"
title   = "Retro Fusion"
theme   = "retro-fusion"

# languageCode was deprecated in Hugo 0.158 in favour of `locale`. Leaving it
# out keeps the demo building warning-free on old and new Hugo alike.
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true

# Posts are paginated on the home page and in sections.
[pagination]
  pagerSize = 5

# Which sections count as "the blog" (used for recent-post widgets, feeds, etc.)
[params]
  mainSections = ["posts"]

  # ==========================================================================
  # THE BIG SWITCH: "blog" or "business"
  # --------------------------------------------------------------------------
  #   blog      classic retro blog index: post cards + sticky sidebar
  #   business  hero -> carousel -> services grid -> FAQ -> recent posts -> CTA
  # Change this one value and the whole homepage changes.
  # ==========================================================================
  mode = "business"
  # mode = "blog"

  description = "A small Hugo theme inspired by early web culture. One stylesheet, one script, no build step."
  tagline     = "Hand-coded, minimal, and finished"
  dateFormat  = "January 2, 2006"
  titleSeparator = "::"

  # ------------------------------------------------------------------------
  # YOU: set these once. They feed both the sidebar "About the Author" widget
  # and the "Written by" box on posts.
  #
  # A single post can override any of them from its own front matter, so a
  # guest post gets its own byline and bio without touching this file:
  #   author: "Grass Hopper"
  #   authorBio: "..."
  #   authorImage: "/images/grass.jpg"
  # ------------------------------------------------------------------------
  author      = "Demo Demarcus"
  authorImage = "/images/demo/avatar.svg"
  authorBio   = "I'm a demo writer. I do no actual work but pretend that its done by me yet people showcase me happily on their blogs." 
  # Where the sidebar's "More about me" button points. Comment it out and the
  # button disappears. Add an `authors` taxonomy under [taxonomies] and you can
  # point this at a term page, e.g. "/authors/abhishek-kumar/".
  authorLink  = "/about/"

  # ==========================================================================
  # Branding
  # ==========================================================================
  [params.logo]
    # Text logo (used when `image` is empty)
    text  = "Retro Fusion"
    style = "pixel"          # pixel | plain | rainbow | chrome
    # Image logo. Set this to use a graphic instead of text.
    image  = ""
    alt    = "Retro Fusion"
    width  = 220
    height = 60
    showBadges = false
    # [[params.headerBadges]]
    #   image = "/images/badges/made-with-hugo.svg"
    #   alt   = "Made with Hugo"

  # Optional pixel font. Leave pixelFontURL empty for zero external requests.
  # [params.theme]
  #   pixelFont    = "'Press Start 2P', monospace"

  # ==========================================================================
  # Navigation bar
  # ==========================================================================
  [params.navbar]
    sticky      = true
    marquee     = "★ Welcome to my homepage! ★ Sign the guestbook! ★ Best viewed at 800x600 ★"
    showMarquee = true
    # searchURL = "/search/"      # renders a small GET search form
    [params.navbar.cta]
      label = "Read the docs"
      url   = "/posts/"

  # ==========================================================================
  # Colour palette & retro texture
  # ==========================================================================
  [params.theme]
    bg          = "#c0c0c0"   # page background
    bgAlt       = "#d4d0c8"   # buttons, bars
    surface     = "#ffffff"   # cards & windows
    surfaceAlt  = "#f4f4f4"
    ink         = "#101010"
    inkSoft     = "#4a4a4a"
    primary     = "#000080"   # navy — window title bars
    primaryAlt  = "#008080"   # teal — title bar gradient end
    accent      = "#ff2d95"   # hot pink
    accentAlt   = "#ffcc00"   # highlighter yellow
    link        = "#0000ee"
    linkVisited = "#551a8b"
    border      = "#000000"
    bevelLight  = "#ffffff"
    bevelDark   = "#6e6e6e"
    radius      = "0"

    fontBody = "Verdana, Geneva, 'DejaVu Sans', sans-serif"
    fontHead = "'Trebuchet MS', 'Segoe UI', Verdana, sans-serif"
    fontMono = "'Courier New', Courier, monospace"

    # none | checker | grid | dots | diagonal | stars
    tile = "checker"

    # CRT scanline overlay (very 1998)
    scanlines = false

    maxWidth = "1080px"
    gap      = "20px"

  # ==========================================================================
  # Business mode: hero
  # ==========================================================================
  # ==========================================================================
  # Business mode: hero
  # --------------------------------------------------------------------------
  # Only rendered when mode = "business" and "hero" is in params.home.sections.
  # ==========================================================================
  [params.hero]
    enable   = true
    layout   = "split"        # split | stacked
    align    = "left"         # left | center | right
    eyebrow  = "A Hugo theme"
    title    = "Built for the <em>small web</em>"
    subtitle = "One stylesheet, one small script, no build step, no third-party requests."
    text     = "<p>Inspired by early web culture and kept deliberately minimal. Switch this site to <code>mode = \"business\"</code> to see the landing-page layout.</p>"
    image        = "/images/demo/hero.svg"
    imageAlt     = "A retro desktop window showing a website"
    imageTitle   = "retro_fusion.gif"
    note         = "No build step · Works without JavaScript"

    [[params.hero.buttons]]
      label = "Read the docs"
      url   = "/posts/"
      style = "accent"
      icon  = "document"

    [[params.hero.buttons]]
      label = "Getting Started"
      url   = "/posts/getting-started/"
      style = "primary"
      icon  = "arrow-up"

  # ==========================================================================
  # Business mode: carousel
  # ==========================================================================
  [params.carousel]
    enable     = true
    title      = "What you get"
    autoplay   = true
    interval   = 6000
    showDots   = true
    showArrows = true

    [[params.carousel.slides]]
      image = "/images/demo/slide-1.svg"
      alt   = "A retro computer illustration"
      title = "No build step"
      text  = "A stylesheet, a script and some templates. Copy the folder and name it in your config."
      link  = "/posts/getting-started/"
      label = "Install it"

    [[params.carousel.slides]]
      image = "/images/demo/slide-2.svg"
      alt   = "Pixel art rocket"
      title = "Works without JavaScript"
      text  = "The carousel scrolls, the FAQ opens and the counter counts with the script blocked."
      link  = "/posts/design-notes/"
      label = "How it degrades"

    [[params.carousel.slides]]
      image = "/images/demo/slide-3.svg"
      alt   = "Retro web badges"
      title = "Everything is configurable"
      text  = "Colours, fonts, layout and texture all come from your hugo.toml."
      link  = "/posts/theming/"
      label = "See the options"

  # ==========================================================================
  # Business mode: services grid
  # ==========================================================================
  [params.services]
    enable    = true
    title     = "Why it is small"
    subtitle  = "Fewer moving parts, fewer things to break."
    columns   = 4
    linkLabel = "Read more"

    [[params.services.items]]
      icon  = "document"
      title = "Semantic HTML5"
      text  = "Real landmarks, one h1 per page, and a skip link that goes somewhere."
      link  = "/posts/design-notes/"

    [[params.services.items]]
      icon  = "tools"
      title = "One stylesheet"
      text  = "Numbered contents at the top, CSS custom properties throughout, no preprocessor."
      link  = "/posts/theming/"

    [[params.services.items]]
      icon = "clock"
      title = "No third-party requests"
      text  = "No fonts, no CDN, no icon library. Everything is served from your own domain."
      link  = "/posts/design-notes/"

    [[params.services.items]]
      icon  = "search"
      title = "Search and social ready"
      text  = "JSON-LD, Open Graph, sitemap and robots out of the box."
      link  = "/posts/search-engines-and-social/"
      badge = "Included"

  # ==========================================================================
  # Business mode: FAQ
  # ==========================================================================
  [params.faq]
    enable   = true
    single   = true
    title    = "Frequently Asked Questions"
    subtitle = "Click a question to expand it."
    footnote = "Anything else is in the <a href=\"/posts/\">documentation</a>."

    [[params.faq.items]]
      question = "Why is there no dark mode?"
      answer   = "Because the palette is a config value. Set `[params.theme]` to something dark and you have dark mode, with no toggle to maintain and no flash of the wrong theme on load."
      open     = true

    [[params.faq.items]]
      question = "Does it work without JavaScript?"
      answer   = "Yes. The site navigates, the carousel scrolls, the FAQ opens and the visitor counter shows a server-rendered number. The script only adds autoplay, dots, focus handling and a small counter bump."

    [[params.faq.items]]
      question = "Can I use it for a business site?"
      answer   = "Set `mode = \"business\"` and the homepage becomes a landing page: hero, carousel, services grid, FAQ and a recent-posts strip. Same templates, same content."

    [[params.faq.items]]
      question = "Is anything tracked by default?"
      answer   = "No. The theme sets no cookies and makes no third-party requests. Analytics is off until you uncomment a block and add your own ID, and it never loads on `hugo server`."

    [[params.faq.items]]
      question = "Why is there no comment system or contact form?"
      answer   = "Both need a backend, and a form that silently drops submissions is worse than an email address. Wire up a service you control if you want one."

  # ==========================================================================
  # Homepage
  # ==========================================================================
  [params.home]
    # ========================================================================
    # SECTION ORDER (business mode only)
    # ------------------------------------------------------------------------
    # The blocks that make up the business homepage, top to bottom. Reorder
    # them however you like, or delete the ones you don't want.
    #
    #   "hero"      headline + buttons + image        (params.hero)
    #   "carousel"  sliding banners / testimonials    (params.carousel)
    #   "services"  the card grid                     (params.services)
    #   "content"   the body of content/_index.md
    #   "faq"       the accordion                     (params.faq)
    #   "posts"     latest posts strip                (params.home.recent*)
    #   "cta"       closing call-to-action band       (params.home.cta)
    #
    # e.g. services first, then testimonials, then FAQ:
    #   sections = ["hero", "services", "carousel", "content", "faq", "posts", "cta"]
    #
    # Omitting this line altogether keeps the default order below. Order and
    # visibility are separate: each block still honours its own `enable` flag,
    # so you can reorder here and switch one off there.
    # ========================================================================
    sections = ["hero", "services", "carousel", "faq", "posts", "cta"]

    showIntro   = true
    introTitle  = "Welcome to my homepage!"
    postsTitle  = "Recent Posts"
    recentPosts = true
    recentCount = 3
    recentTitle = "Latest From the Blog"
    recentSubtitle = "Occasional dispatches about the small web."
    recentColumns = 3

    [params.home.cta]
      title  = "Ready to read the rest?"
      text   = "Every option is documented, with the config to copy."
      [params.home.cta.button]
        label = "Start with Getting Started"
        url   = "/posts/getting-started/"

  # ==========================================================================
  # Sidebar (blog mode)
  # ==========================================================================
  [params.sidebar]
    enable    = true
    sticky    = true
    onSingle  = true

    author      = true
    authorTitle = "About the Author"
    # Name / avatar / bio / link are inherited from [params.author*] above.
    # Set any of them here to give the sidebar DIFFERENT details from the
    # "Written by" box on post pages:
    #   authorName  = "..."
    #   authorImage = "..."
    #   authorBio   = "..."
    #   authorLink  = "..."

    counter        = true
    counterTitle   = "Visitors"
    counterBase    = 1048576
    counterPerDay  = 137
    counterNote    = "You are not alone on the information superhighway."

    recent      = true
    recentTitle = "Fresh Off the Press"
    recentCount = 5

    categories      = true
    categoriesTitle = "Categories"

    tags      = true
    tagsTitle = "Tags"
    tagCount  = 24

    # 88x31 badges in the sidebar. The footer already shows them, and this
    # widget has nothing to render unless you define [[params.footer.badges]]
    # so it stays off by default rather than drawing an empty box.
    badges = false

    # Arbitrary HTML widgets. Add as many as you like; they render in order.
    # [[params.sidebar.widgets]]
    #   title   = "Now Playing"
    #   content = "<p>💿 Dial-up.mp3</p>"

  # ==========================================================================
  # Post behaviour
  # ==========================================================================
  [params.post]
    toc         = true
    tocOpen     = true
    tocTitle    = "Contents"
    share       = true
    shareNetworks = ["x", "facebook", "linkedin", "reddit", "mastodon", "email", "copy", "print"]
    related     = true
    relatedCount = 3
    prevNext    = true
    readingTime = true
    wordCount   = false
    showLastmod = true
    authorBox   = true

  # ==========================================================================
  # Post cards
  # --------------------------------------------------------------------------
  # Cards are padded and clamped to a uniform height, so a list of posts reads
  # as an even grid instead of a ragged stack, regardless of how long each
  # summary or title is, and whether or not a post has a cover image.
  # ==========================================================================
  [params.list]
    showThumbnails = true
    showTags       = true

    columns       = 1     # 1 = classic full-width list; 2, 3 or 4 = grid of tiles
    excerptLines  = 3     # excerpt padded AND clamped to exactly this many lines
    titleLines    = 2     # same trick for titles, so they line up too
    excerptLength = 220   # character cap, applied before the CSS clamp

    # Tag chips can't wrap internally (a chip is one unbreakable label), so the
    # way to stop a row spilling out of a card is to show fewer of them.
    maxTags       = 3     # chips on a card in the full-width list
    maxTagsGrid   = 2     # chips in a narrow multi-column tile

  # Feature toggles
  [params.features]
    breadcrumbs = true
    opengraph   = true
    publishDate = true

  # ==========================================================================
  # Footer
  # ==========================================================================
  [params.footer]
    showLogo       = true
    aboutTitle     = "About This Site"
    about          = "A hand-built corner of the web. No trackers, no pop-ups, no infinite scroll — just pages that load."
    backToTop      = true
    defaultBadges  = true
    badgesTitle    = "Web Rings & Badges"

    # --- Copyright line (bottom of the footer) ------------------------------
    # Leave `copyright` unset for the default, which is:
    #     © <current year> <site title>. All rights reserved.
    # Or write your own, raw HTML is fine:
    #   copyright = "&copy; 2026 Retro Fusion. All rights reserved."
    #   copyright = "&copy; 2026 Retro Fusion · Made in a shed in Sheffield"

    # --- Attribution line (the small print under the copyright) -------------
    #   showBuiltWith = true   -> the default "Powered by Hugo · Theme Retro Fusion"
    #   showBuiltWith = false  -> remove the line entirely
    #   builtWith     = "..."  -> keep the line but put your own text in it
    #                             (empty string renders nothing)
    showBuiltWith  = true
    # builtWith = "Hand-built with <a href=\"https://gohugo.io/\">Hugo</a> · No trackers, no cookies"

    [[params.footer.links]]
      title = "Explore"
      [[params.footer.links.items]]
        name = "Home"
        url  = "/"
        icon = "home"
      [[params.footer.links.items]]
        name = "Docs"
        url  = "/posts/"
        icon = "document"
      [[params.footer.links.items]]
        name = "Design Notes"
        url  = "/posts/design-notes/"
        icon = "tools"
      [[params.footer.links.items]]
        name = "About"
        url  = "/about/"
        icon = "user"

    [[params.footer.links]]
      title = "Elsewhere"
      [[params.footer.links.items]]
        name = "RSS Feed"
        url  = "/index.xml"
        icon = "rss"
      [[params.footer.links.items]]
        name = "Categories"
        url  = "/categories/"
        icon = "folder"
      [[params.footer.links.items]]
        name = "Tags"
        url  = "/tags/"
        icon = "tag"
      [[params.footer.links.items]]
        name = "Series"
        url  = "/series/"
        icon = "list"

    # Override the shipped default 88x31 badges, or add your own:
    # [[params.footer.badges]]
    #   image = "/images/badges/made-with-hugo.svg"
    #   alt   = "Made with Hugo"
    #   url   = "https://gohugo.io/"

    # `icon` takes a name from the built-in inline SVG set (see the README for
    # the full list). An emoji still works if you prefer one.
    [[params.footer.social]]
      name = "GitHub"
      url  = "https://github.com/hellofuji"
      icon = "github"
    [[params.footer.social]]
      name = "Mastodon"
      url  = "https://mastodon.social/"
      icon = "mastodon"
    [[params.footer.social]]
      name = "Email"
      url  = "mailto:hello@abhishkkumar.com"
      icon = "email"

  # ==========================================================================
  # Analytics - off by default
  # --------------------------------------------------------------------------
  # Uncomment the block for whichever service you use and paste your ID in.
  # That is the whole setup. There is nothing to change in the templates, and
  # `hugo server` never loads analytics, so previewing stays out of your stats.
  # ==========================================================================
  [params.analytics]
    # Google Analytics 4
    # [params.analytics.google]
    #   id = "G-XXXXXXXXXX"

    # Plausible - cookieless, so no consent banner needed
    # [params.analytics.plausible]
    #   domain = "yourdomain.com"

    # Anything else: a self-hosted counter, a verification tag, a snippet
    # [params.analytics.custom]
    #   head   = "<script>...</script>"
    #   footer = "<script>...</script>"

  # A Web 1.0 webring navigator, shown above the footer.
  # [params.analytics.webring]
  #   enable = true
  #   name   = "The Retro Ring"
  #   prev   = "https://example.org/prev/"
  #   next   = "https://example.org/next/"
  #   random = "https://example.org/random/"
  #   list   = "https://example.org/ring/"

  [params.privacy]
    disableAnalytics      = true
    # Never fire analytics on `hugo server`.
    disableAnalyticsLocal = true
    anonymizeIP           = true

  # Optional extra stylesheets / scripts (paths under static/)
  # customCSS = ["/css/my-overrides.css"]
  # customJS  = ["/js/my-widget.js"]

# ============================================================================
# Menus, multi-level dropdowns.
# ----------------------------------------------------------------------------
# Menu entries are a FLAT array. Nesting is expressed with `parent`, which
# points at the ancestor's `identifier` (or its `name` when no identifier is
# set). A nested `[[menus.main.children]]` array parses but does NOT build a
# tree, Hugo ignores it. Always use `identifier` + `parent`.
#
# Nesting works to any depth: give a child its own `identifier` and point a
# grandchild's `parent` at it.
# ============================================================================
# ============================================================================
# Menus
# ----------------------------------------------------------------------------
# Menu entries are a FLAT array. Nesting is expressed with `parent`, which
# names the ancestor's `identifier` (or its `name` when no identifier is set).
# A nested [[menus.main.children]] array parses but does NOT build a tree.
# ============================================================================
[menus]
  [[menus.main]]
    name    = "Home"
    pageRef = "/"
    weight  = 10

  # ---- Documentation (parent) ----
  [[menus.main]]
    name       = "Docs"
    identifier = "docs"
    pageRef    = "/posts"
    weight     = 20

  [[menus.main]]
    name    = "Getting Started"
    parent  = "docs"
    pageRef = "/posts/getting-started"
    weight  = 10

  [[menus.main]]
    name    = "Configuration"
    parent  = "docs"
    pageRef = "/posts/where-your-config-lives"
    weight  = 20

  [[menus.main]]
    name    = "Theming"
    parent  = "docs"
    pageRef = "/posts/theming"
    weight  = 30

  [[menus.main]]
    name    = "Analytics"
    parent  = "docs"
    pageRef = "/posts/analytics-and-privacy"
    weight  = 40

  [[menus.main]]
    name    = "All Docs"
    parent  = "docs"
    pageRef = "/posts"
    weight  = 50

  # ---- Standalone ----
  [[menus.main]]
    name    = "About"
    pageRef = "/about"
    weight  = 30

  [[menus.footer]]
    name   = "Documentation"
    url    = "/posts/"
    weight = 10

# ============================================================================
# Taxonomies, categories and tags plus a custom `series` taxonomy.
# ============================================================================
[taxonomies]
  category = "categories"
  tag      = "tags"
  series   = "series"

# ============================================================================
# Markup
# ============================================================================
[markup]
  [markup.highlight]
    noClasses = false
    lineNos    = false
    tabWidth   = 2
    style      = "monokai"

  [markup.goldmark.renderer]
    unsafe = true              # lets you use raw HTML in Markdown

  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false

[outputs]
  home    = ["html", "rss"]
  section = ["html", "rss"]
